name: Bug Report
description: Report a bug in frostpillar-db
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code or steps to reproduce the issue.
      placeholder: |
        ```ts
        import { Database } from 'frostpillar-db';

        const db = new Database({});
        const users = db.collection('users');

        // Steps that trigger the bug...
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Runtime
      options:
        - Node.js (ESM)
        - Node.js (CJS)
        - Browser (IIFE bundle)
        - Browser (via bundler)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package Version
      placeholder: '0.1.0'
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version (if applicable)
      placeholder: '24.0.0'

  - type: dropdown
    id: storage-driver
    attributes:
      label: Which storage driver is affected?
      options:
        - In-memory (default)
        - File (Node.js)
        - localStorage
        - IndexedDB
        - OPFS
        - syncStorage (browser extension)
        - Not sure

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, error messages, or screenshots.
